services:
  db:
    image: postgres:16-alpine
    container_name: fixedincome-db
    environment:
      POSTGRES_DB: fixedincome
      POSTGRES_USER: fixedincome
      POSTGRES_PASSWORD: fixedincome
    ports:
      - "5432:5432"
    volumes:
      - fixedincome-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixedincome -d fixedincome"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixedincome-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=fixedincome;Username=fixedincome;Password=fixedincome"
    ports:
      - "8080:8080"

volumes:
  fixedincome-db-data:
