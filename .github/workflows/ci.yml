name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite que o release.yml reaproveite estes mesmos passos como pré-condição da imagem.
  workflow_call:

# Permissão mínima no nível do workflow: sem este bloco, PR de branch do mesmo repositório
# herdaria o padrão do repositório, que pode incluir escrita. O CI só lê o código.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nenhum passo faz git push; sem isso o token ficaria gravado em .git/config.
          persist-credentials: false

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      # Roda antes dos passos com Docker: uma violação de camada falha em segundos, sem baixar
      # a imagem do PostgreSQL.
      # Sem cobertura: o projeto só verifica dependências entre camadas e não tem código de
      # produção próprio para cobrir.
      - name: Testes de Arquitetura
        run: dotnet test tests/FixedIncome.Architecture.Tests --configuration Release --no-build

      # A execução conjunta dos cinco projetos de teste em um único `dotnet test` na
      # solution é instável: o data collector do coverlet pode não concluir o flush do
      # relatório do projeto mais rápido antes do encerramento do test host, gerando um
      # coverage.cobertura.xml vazio. Rodar sequencialmente, um projeto por vez, evita a
      # corrida em vez de mascará-la com continue-on-error.
      - name: Testes de Domain (com cobertura)
        run: dotnet test tests/FixedIncome.Domain.Tests --configuration Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage/Domain

      - name: Testes de Application (com cobertura)
        run: dotnet test tests/FixedIncome.Application.Tests --configuration Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage/Application

      # Usa o Docker do runner: cada assembly de teste de integração baixa a imagem postgres:16
      # e a do Ryuk (limpeza dos contêineres do Testcontainers). Se aparecer `toomanyrequests`,
      # é o limite de pull anônimo do Docker Hub, não falha do código.
      - name: Testes de Infrastructure (com cobertura)
        run: dotnet test tests/FixedIncome.Infrastructure.Tests --configuration Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage/Infrastructure

      # Também usa o Docker do runner (postgres:16 e Ryuk); ver o aviso sobre `toomanyrequests`
      # no passo de Infrastructure.
      - name: Testes de Api (com cobertura)
        run: dotnet test tests/FixedIncome.Api.Tests --configuration Release --no-build --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage/Api

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ./coverage
          # Nome fixo: num "Re-run failed jobs" o artefato da tentativa anterior já existe,
          # e sem overwrite o upload conflitaria.
          overwrite: true
